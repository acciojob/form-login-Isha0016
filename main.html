<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Return first and last name from a form</title>
</head>
<body>

    <form onsubmit="getFormvalue(); return false;">
        <label>First Name:</label>
        <input type="text" name="fname" id="fname">

        <br><br>

        <label>Last Name:</label>
        <input type="text" name="lname" id="lname">

        <br><br>

        <input type="submit" value="Submit">
    </form>

    <script>
        function getFormvalue() {
            const firstName = document.querySelector('[name="fname"]').value.trim();
            const lastName = document.querySelector('[name="lname"]').value.trim();

            alert(`${firstName} ${lastName}`.trim());
        }
    </script>

</body>
</html>
